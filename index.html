  <meta name="theme-color" content="#0d1117">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    @media (min-width: 1024px) {
      html {
        font-size: 90%;
      }
    }
    :root {
      --bg-color: #07090e;
      --text-color: #ffffff;
      --accent-lime: #ccff00;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s, color 0.3s;
    }
    
    body:not(.crm-mode) h1, body:not(.crm-mode) h2, body:not(.crm-mode) h3, .heading-font {
      font-family: 'Outfit', sans-serif;
      letter-spacing: -0.03em;
    }
    .mono-font {
      font-family: 'IBM Plex Mono', monospace;
    }

    /* Shravya Tours Inspired Admin CRM Typography */
    .crm-theme, .crm-theme input, .crm-theme select, .crm-theme textarea, .crm-theme button, .crm-theme table {
      font-family: 'DM Sans', sans-serif !important;
      letter-spacing: normal;
    }
    .crm-theme h1, .crm-theme h2, .crm-theme h3, .crm-theme h4, .crm-theme h5, .crm-theme h6, .crm-theme .crm-heading, .crm-theme .font-display {
      font-family: 'Outfit', sans-serif !important;
      text-transform: none;
      letter-spacing: -0.025em;
    }
    .crm-theme .crm-serif {
      font-family: 'Cormorant Garamond', serif !important;
    }
    .crm-theme .font-mono {
      font-family: 'IBM Plex Mono', monospace !important;
    }
    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .animate-marquee {
      display: inline-block;
      white-space: nowrap;
      animation: marquee 25s linear infinite;
    }
    
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      height: 4px;
      border-radius: 2px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: white;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }
  </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
